[project]
name = "baymax"
version = "0.1.0"
description = "A locally-hostable agent that:"
# 1. Accepts voice or text input describing a productivity task 
# 2. Selects and executes a sequence of tool calls (Notion, Calendar, Gmail, clipboard) 
# 3. Confirms or asks for clarification 
# 4. Logs every action with a trace ID for audit
readme = "README.md"
authors = [
    { name = "M-a-k-l-o-v", email = "mmarvellous69@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "requests>=2.32",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.25.0",
    "pyright>=1.1.410",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
exclude = [
    "archive",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Default rule set is fine for now; tighten later.
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Legacy task_manager code — will be replaced by src/baymax_tools/notion/ during Phase 1.
# Don't burn time hand-fixing style debt in code that's about to be discarded.
"task_manager/*.py" = ["F541", "E501", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "task_manager", "tests"]
exclude = ["archive", ".venv", "**/__pycache__", "**/.*"]
pythonVersion = "3.12"
pythonPlatform = "All"
# Start with basic mode for the whole project; flip individual modules to
# strict as they mature. The CV's rule: defensible code in core modules,
# pragmatic elsewhere.
typeCheckingMode = "basic"
# Add module paths here as they become production-grade.
# Example: strict = ["src/baymax/core", "src/baymax/eval"]
strict = []
# Legacy task_manager pre-dates the type-discipline rules — don't block
# CI on it. Will get rewritten as src/baymax_tools/notion/.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
